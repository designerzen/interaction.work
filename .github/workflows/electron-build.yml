name: Build Electron App

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: PhotoSYNTH
            asset_extension: AppImage
          - os: macos-latest
            artifact_name: PhotoSYNTH
            asset_extension: dmg
          - os: windows-latest
            artifact_name: PhotoSYNTH
            asset_extension: exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app (Unix)
        if: runner.os != 'Windows'
        run: cd apps/photosynth && pnpm electron:build

      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        run: |
          cd apps/photosynth
          pnpm electron:build
        shell: pwsh

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: photosynth-linux
          path: apps/photosynth/dist/*.AppImage
          retention-days: 30

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: photosynth-macos
          path: |
            apps/photosynth/dist/*.dmg
            apps/photosynth/dist/*.zip
          retention-days: 30

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: photosynth-windows
          path: |
            apps/photosynth/dist/*.exe
            apps/photosynth/dist/*.zip
          retention-days: 30

      - name: List build output
        run: ls -la apps/photosynth/dist/
        shell: bash
        if: always()

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            photosynth-linux/*
            photosynth-macos/*
            photosynth-windows/*
          draft: false
          prerelease: false
