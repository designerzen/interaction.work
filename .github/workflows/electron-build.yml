name: Build Electron App

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: PhotoSYNTH
            asset_extension: AppImage
          - os: macos-latest
            artifact_name: PhotoSYNTH
            asset_extension: dmg
          - os: windows-latest
            artifact_name: PhotoSYNTH
            asset_extension: exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd apps/photosynth
          echo "Starting Linux build..."
          pnpm dist:linux
          echo "Linux build completed"
          ls -la dist-apps/ || echo "dist-apps directory not found"

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd apps/photosynth
          echo "Starting macOS build..."
          pnpm dist:mac
          echo "macOS build completed"
          ls -la dist-apps/ || echo "dist-apps directory not found"

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd apps/photosynth
          Write-Host "Starting Windows build..."
          pnpm dist:win
          Write-Host "Windows build completed"
          Get-Item dist-apps -ErrorAction SilentlyContinue | Get-ChildItem | ForEach-Object { $_.FullName }
          if (-not (Test-Path dist-apps)) { Write-Host "dist-apps directory not found" }
        shell: pwsh

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: photosynth-linux
          path: apps/photosynth/dist-apps/*.AppImage
          retention-days: 30

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: photosynth-macos
          path: |
            apps/photosynth/dist-apps/*.dmg
            apps/photosynth/dist-apps/*.zip
          retention-days: 30

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: photosynth-windows
          path: |
            apps/photosynth/dist-apps/*.exe
            apps/photosynth/dist-apps/*.msi
            apps/photosynth/dist-apps/*.zip
          retention-days: 30

      - name: List build output
        run: |
          echo "Checking for dist-electron:"
          ls -la apps/photosynth/dist-electron/ || echo "dist-electron not found"
          echo ""
          echo "Checking for dist:"
          ls -la apps/photosynth/dist/ | head -20 || echo "dist not found"
          echo ""
          echo "Checking for dist-apps (expected location):"
          ls -la apps/photosynth/dist-apps/ || echo "dist-apps not found"
          echo ""
          echo "Searching for any .AppImage, .dmg, or .exe files in the workspace:"
          find . -maxdepth 5 \( -name "*.AppImage" -o -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \) 2>/dev/null | head -20
          echo ""
          echo "Checking home directory for build output:"
          find ~/ -maxdepth 3 \( -name "*.AppImage" -o -name "*.dmg" -o -name "*.exe" \) 2>/dev/null | grep -i photosynth | head -10
        shell: bash
        if: always()

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            photosynth-linux/*
            photosynth-macos/*
            photosynth-windows/*
          draft: false
          prerelease: false
