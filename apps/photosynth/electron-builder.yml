appId: com.designerzen.photosynth


type: distribution
productName: PhotoSYNTH
entitlements: source-electron/entitlements.plist
entitlementsInherit: source-electron/entitlements.plist
extendInfo: 
  NSMicrophoneUsageDescription: "Please grant access to your microphone"
  NSCameraUsageDescription: "Please grant access to your camera"
directories:
  buildResources: build/icons
  output: releases
files:
  - dist-electron
  - dist
  - node_modules
asarUnpack:
  - resources/**
win:
  target:
    - nsis
    - portable
    - msi
  icon: build/icons/win/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-${version}.${ext}
msi:
  oneClick: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - dmg
    - zip
  icon: build/icons/mac/icon.icns
dmg:
  icon: build/icons/mac/icon.icns
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file
linux:
  target:
    - AppImage
    - deb
  category: Multimedia
  icon: build/icons/png/512x512.png